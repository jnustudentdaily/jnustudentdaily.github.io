<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>

  <!-- Title + meta are filled by app.js from the article data (SEO per-story). -->
  <title>Article · JNU Student Daily</title>
  <meta name="description" content="JNU Student Daily article."/>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body data-page="article">
  <header id="site-header"></header>
  <main id="article-root">
    <!-- Article injected by app.js based on ?id= in the URL -->
    <div class="wrap article"><p class="meta">Loading article…</p></div>
  </main>
  <footer id="site-footer"></footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
