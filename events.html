<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Events · JNU Student Daily</title>
  <meta name="description" content="Seminars, workshops, cultural evenings and student activities across the JNU campus — today and upcoming."/>
  <link rel="canonical" href="https://your-domain.example/events.html"/>
  <meta property="og:title" content="Events · JNU Student Daily"/>
  <meta property="og:description" content="Seminars, workshops and cultural events across JNU."/>
  <meta property="og:type" content="website"/>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body data-page="events">
  <header id="site-header"></header>

  <main>
    <section class="section">
      <div class="wrap">
        <div class="section__head">
          <h1 class="section__title">Today's Events<span class="spine-dot">.</span></h1>
        </div>
        <div class="grid grid--2" id="events-today"></div>
      </div>
    </section>

    <section class="section">
      <div class="wrap">
        <div class="section__head">
          <h2 class="section__title">Upcoming<span class="spine-dot">.</span></h2>
        </div>
        <div class="filters" id="event-filters" role="group" aria-label="Filter events">
          <button class="filter" data-cat="all" aria-pressed="true">All</button>
          <button class="filter" data-cat="Seminar" aria-pressed="false">Seminars</button>
          <button class="filter" data-cat="Workshop" aria-pressed="false">Workshops</button>
          <button class="filter" data-cat="Cultural" aria-pressed="false">Cultural</button>
        </div>
        <div class="grid grid--2" id="events-upcoming"></div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
